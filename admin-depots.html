<!DOCTYPE html>  <html lang="fr">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>ROLEX ADMIN — Dépôts</title>    <link rel="stylesheet"  
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <style>  
    * {  
      box-sizing: border-box;  
      margin: 0;  
      padding: 0;  
    }  
  
    body {  
      font-family: Arial, sans-serif;  
      background: #03140a;  
      color: #f5f5f5;  
      min-height: 100vh;  
    }  
  
    .topbar {  
      height: 70px;  
      background: #051e10;  
      border-bottom: 1px solid rgba(212,163,23,.25);  
      display: flex;  
      align-items: center;  
      justify-content: space-between;  
      padding: 0 24px;  
      position: sticky;  
      top: 0;  
      z-index: 20;  
    }  
  
    .brand {  
      display: flex;  
      align-items: center;  
      gap: 12px;  
      font-weight: 800;  
      color: #d4a317;  
      letter-spacing: 1px;  
    }  
  
    .brand-icon {  
      width: 40px;  
      height: 40px;  
      border-radius: 10px;  
      display: grid;  
      place-items: center;  
      background: rgba(212,163,23,.12);  
      border: 1px solid rgba(212,163,23,.3);  
    }  
  
    .back-btn {  
      border: 1px solid rgba(255,255,255,.1);  
      background: #092516;  
      color: #fff;  
      padding: 10px 15px;  
      border-radius: 9px;  
      cursor: pointer;  
    }  
  
    .back-btn:hover {  
      border-color: #d4a317;  
    }  
  
    main {  
      max-width: 1400px;  
      margin: auto;  
      padding: 28px 20px 50px;  
    }  
  
    .page-title {  
      margin-bottom: 22px;  
    }  
  
    .page-title h1 {  
      font-size: 27px;  
      margin-bottom: 7px;  
    }  
  
    .page-title p {  
      color: #9daaa2;  
      font-size: 14px;  
    }  
  
    .toolbar {  
      display: flex;  
      gap: 12px;  
      flex-wrap: wrap;  
      margin-bottom: 20px;  
    }  
  
    select,  
    input {  
      background: #071d11;  
      border: 1px solid rgba(255,255,255,.12);  
      color: white;  
      border-radius: 9px;  
      padding: 12px 14px;  
      outline: none;  
    }  
  
    select:focus,  
    input:focus {  
      border-color: #d4a317;  
    }  
  
    .refresh-btn {  
      background: #d4a317;  
      color: #071108;  
      border: 0;  
      border-radius: 9px;  
      padding: 12px 17px;  
      font-weight: 700;  
      cursor: pointer;  
    }  
  
    .refresh-btn:hover {  
      opacity: .9;  
    }  
  
    .message {  
      display: none;  
      padding: 13px 15px;  
      border-radius: 9px;  
      margin-bottom: 18px;  
      font-size: 14px;  
    }  
  
    .message.show {  
      display: block;  
    }  
  
    .message.error {  
      background: rgba(220,38,38,.12);  
      border: 1px solid rgba(220,38,38,.3);  
      color: #ff9d9d;  
    }  
  
    .message.success {  
      background: rgba(16,185,129,.12);  
      border: 1px solid rgba(16,185,129,.3);  
      color: #7ee8bf;  
    }  
  
    .table-card {  
      background: #051e10;  
      border: 1px solid rgba(255,255,255,.08);  
      border-radius: 15px;  
      overflow: hidden;  
    }  
  
    .table-wrap {  
      overflow-x: auto;  
    }  
  
    table {  
      width: 100%;  
      border-collapse: collapse;  
      min-width: 1050px;  
    }  
  
    th {  
      text-align: left;  
      font-size: 12px;  
      color: #9daaa2;  
      text-transform: uppercase;  
      letter-spacing: .5px;  
      padding: 16px;  
      background: #071b10;  
      border-bottom: 1px solid rgba(255,255,255,.08);  
    }  
  
    td {  
      padding: 16px;  
      border-bottom: 1px solid rgba(255,255,255,.06);  
      font-size: 14px;  
      vertical-align: middle;  
    }  
  
    tr:last-child td {  
      border-bottom: 0;  
    }  
  
    .user-name {  
      font-weight: 700;  
    }  
  
    .user-code {  
      color: #89978f;  
      font-size: 12px;  
      margin-top: 4px;  
    }  
  
    .amount {  
      color: #d4a317;  
      font-weight: 800;  
      white-space: nowrap;  
    }  
  
    .status {  
      display: inline-flex;  
      padding: 6px 9px;  
      border-radius: 20px;  
      font-size: 11px;  
      font-weight: 700;  
    }  
  
    .status.pending {  
      background: rgba(234,179,8,.12);  
      color: #facc15;  
    }  
  
    .status.verified {  
      background: rgba(59,130,246,.12);  
      color: #60a5fa;  
    }  
  
    .status.approved {  
      background: rgba(16,185,129,.12);  
      color: #34d399;  
    }  
  
    .status.rejected {  
      background: rgba(239,68,68,.12);  
      color: #f87171;  
    }  
  
    .actions {  
      display: flex;  
      gap: 7px;  
      flex-wrap: wrap;  
    }  
  
    .action-btn {  
      border: 0;  
      border-radius: 7px;  
      padding: 8px 10px;  
      font-size: 12px;  
      font-weight: 700;  
      cursor: pointer;  
      white-space: nowrap;  
    }  
  
    .verify {  
      background: #1d4ed8;  
      color: white;  
    }  
  
    .approve {  
      background: #059669;  
      color: white;  
    }  
  
    .reject {  
      background: #991b1b;  
      color: white;  
    }  
  
    .action-btn:disabled {  
      opacity: .45;  
      cursor: not-allowed;  
    }  
  
    .empty {  
      padding: 50px 20px;  
      text-align: center;  
      color: #87958d;  
    }  
  
    .empty i {  
      font-size: 32px;  
      margin-bottom: 12px;  
      color: #52635a;  
    }  
  
    .loading {  
      padding: 45px;  
      text-align: center;  
      color: #9daaa2;  
    }  
  
    .loading i {  
      margin-right: 8px;  
    }  
  
    .modal {  
      position: fixed;  
      inset: 0;  
      background: rgba(0,0,0,.7);  
      display: none;  
      align-items: center;  
      justify-content: center;  
      padding: 20px;  
      z-index: 100;  
    }  
  
    .modal.show {  
      display: flex;  
    }  
  
    .modal-box {  
      width: 100%;  
      max-width: 460px;  
      background: #071b10;  
      border: 1px solid rgba(212,163,23,.25);  
      border-radius: 15px;  
      padding: 22px;  
    }  
  
    .modal-box h2 {  
      font-size: 19px;  
      margin-bottom: 9px;  
    }  
  
    .modal-box p {  
      color: #9daaa2;  
      font-size: 13px;  
      line-height: 1.5;  
      margin-bottom: 15px;  
    }  
  
    textarea {  
      width: 100%;  
      min-height: 110px;  
      resize: vertical;  
      background: #03140a;  
      border: 1px solid rgba(255,255,255,.12);  
      border-radius: 9px;  
      color: white;  
      padding: 12px;  
      outline: none;  
    }  
  
    textarea:focus {  
      border-color: #d4a317;  
    }  
  
    .modal-actions {  
      display: flex;  
      justify-content: flex-end;  
      gap: 10px;  
      margin-top: 15px;  
    }  
  
    .cancel-btn {  
      background: #15241b;  
      color: white;  
      border: 1px solid rgba(255,255,255,.1);  
      border-radius: 8px;  
      padding: 10px 15px;  
      cursor: pointer;  
    }  
  
    .confirm-reject {  
      background: #b91c1c;  
      color: white;  
      border: 0;  
      border-radius: 8px;  
      padding: 10px 15px;  
      cursor: pointer;  
      font-weight: 700;  
    }  
  
    @media (max-width: 600px) {  
      main {  
        padding: 22px 12px 40px;  
      }  
  
      .topbar {  
        padding: 0 14px;  
      }  
  
      .page-title h1 {  
        font-size: 23px;  
      }  
  
      .brand span {  
        font-size: 13px;  
      }  
    }  
  </style>  </head>  <body>    <header class="topbar">  
    <div class="brand">  
      <div class="brand-icon">  
        <i class="fa-solid fa-shield-halved"></i>  
      </div>  
      <span>ROLEX ADMIN</span>  
    </div>  <button class="back-btn" id="backBtn">  
  <i class="fa-solid fa-arrow-left"></i>  
  Tableau de bord  
</button>

  </header>    <main>  <section class="page-title">  
  <h1>Gestion des dépôts</h1>  
  <p>Vérification, validation et rejet des demandes de dépôt.</p>  
</section>  

<div id="message" class="message"></div>  

<div class="toolbar">  
  <select id="statusFilter">  
    <option value="">Tous les dépôts</option>  
    <option value="pending">En attente</option>  
    <option value="verified">Vérifiés</option>  
    <option value="approved">Validés</option>  
    <option value="rejected">Rejetés</option>  
  </select>  

  <input  
    type="text"  
    id="searchInput"  
    placeholder="Rechercher un utilisateur..."  
  >  

  <button class="refresh-btn" id="refreshBtn">  
    <i class="fa-solid fa-rotate"></i>  
    Actualiser  
  </button>  
</div>  

<section class="table-card">  
  <div id="loading" class="loading">  
    <i class="fa-solid fa-spinner fa-spin"></i>  
    Chargement des dépôts...  
  </div>  

  <div class="table-wrap" id="tableContainer" style="display:none;">  
    <table>  
      <thead>  
        <tr>  
          <th>Utilisateur</th>  
          <th>Pays</th>  
          <th>Téléphone payeur</th>  
          <th>Montant</th>  
          <th>Date</th>  
          <th>Statut</th>  
          <th>Actions</th>  
        </tr>  
      </thead>  
      <tbody id="depositBody"></tbody>  
    </table>  
  </div>  

  <div id="emptyState" class="empty" style="display:none;">  
    <i class="fa-solid fa-inbox"></i>  
    <div>Aucun dépôt trouvé.</div>  
  </div>  
</section>

  </main>    <div class="modal" id="rejectModal">  
    <div class="modal-box">  
      <h2>Rejeter le dépôt</h2>  
      <p>  
        Indiquez obligatoirement le motif du rejet.  
      </p>  <textarea  
    id="rejectReason"  
    placeholder="Motif du rejet..."  
  ></textarea>  

  <div class="modal-actions">  
    <button class="cancel-btn" id="cancelReject">  
      Annuler  
    </button>  

    <button class="confirm-reject" id="confirmReject">  
      <i class="fa-solid fa-xmark"></i>  
      Rejeter  
    </button>  
  </div>  
</div>

  </div>    <script src="admin-depots.js"></script>  </body>  
</html>
