<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROLEX — Administration</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top,
          rgba(212, 163, 23, 0.10),
          transparent 35%
        ),
        #03140a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #051e10;
      border: 1px solid rgba(212, 163, 23, 0.35);
      color: #d4a317;
      font-size: 30px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .brand h1 {
      font-size: 29px;
      letter-spacing: 2px;
      color: #d4a317;
      margin-bottom: 7px;
    }

    .brand p {
      color: #91a299;
      font-size: 14px;
    }

    .login-card {
      background: rgba(5, 30, 16, 0.96);
      border: 1px solid rgba(212, 163, 23, 0.20);
      border-radius: 20px;
      padding: 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.40);
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-description {
      color: #91a299;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #d9e4dd;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #78887e;
      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      height: 50px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.10);
      outline: none;
      background: #03140a;
      color: #fff;
      font-size: 14px;
      padding: 0 14px 0 42px;
      transition: .2s;
    }

    select {
      appearance: auto;
      cursor: pointer;
    }

    input::placeholder {
      color: #65746b;
    }

    input:focus,
    select:focus {
      border-color: rgba(212, 163, 23, 0.65);
      box-shadow: 0 0 0 3px rgba(212, 163, 23, 0.08);
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #78887e;
      cursor: pointer;
      font-size: 15px;
    }

    .password-toggle:hover {
      color: #d4a317;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 5px;
      border: none;
      border-radius: 11px;
      background: #d4a317;
      color: #071108;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .login-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(180, 45, 45, 0.12);
      border: 1px solid rgba(220, 70, 70, 0.35);
      color: #ff9d9d;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.30);
      color: #73e0b8;
    }

    .security-note {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #65746b;
      font-size: 12px;
      text-align: center;
    }

    .security-note i {
      color: #10b981;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #536159;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .login-card {
        padding: 22px 18px;
      }

      .brand h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="brand">

      <div class="brand-icon">
        <i class="fa-solid fa-crown"></i>
      </div>

      <h1>ROLEX</h1>

      <p>Espace administrateur</p>

    </div>


    <section class="login-card">

      <h2 class="card-title">
        Connexion
      </h2>

      <p class="card-description">
        Connectez-vous à votre espace d'administration.
      </p>


      <div
        id="message"
        class="message"
      ></div>


      <form id="adminLoginForm">

        <!-- PAYS -->

        <div class="form-group">

          <label for="country">
            Pays
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-globe input-icon"></i>

            <select id="country" required>

              <option value="">
                Sélectionner un pays
              </option>

              <option value="BF">
                Burkina Faso
              </option>

              <option value="CI">
                Côte d'Ivoire
              </option>

              <option value="BJ">
                Bénin
              </option>

              <option value="CM">
                Cameroun
              </option>

            </select>

          </div>

        </div>


        <!-- TELEPHONE -->

        <div class="form-group">

          <label for="phone">
            Numéro de téléphone
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-phone input-icon"></i>

            <input
              type="tel"
              id="phone"
              placeholder="Ex. 0700000000"
              autocomplete="tel"
              inputmode="numeric"
              required
            >

          </div>

        </div>


        <!-- MOT DE PASSE -->

        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <div class="input-wrapper password-wrapper">

            <i class="fa-solid fa-lock input-icon"></i>

            <input
              type="password"
              id="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Afficher le mot de passe"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          Se connecter
        </button>

      </form>


      <div class="security-note">

        <i class="fa-solid fa-shield-halved"></i>

        <span>
          Accès réservé aux administrateurs autorisés
        </span>

      </div>

    </section>


    <div class="footer">
      ROLEX Administration
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://cbxjcwjlhvicurpndoyz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KUd51SQCl10pIgztFFGq9Q_Jp1YCK6o";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const form =
      document.getElementById("adminLoginForm");

    const country =
      document.getElementById("country");

    const phone =
      document.getElementById("phone");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");


    /* ==========================================
       MESSAGE
    ========================================== */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent =
        text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    /* ==========================================
       AFFICHER / MASQUER MOT DE PASSE
    ========================================== */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          password.type === "password";


        password.type =
          isPassword
            ? "text"
            : "password";


        togglePassword.innerHTML =
          isPassword
            ? '<i class="fa-solid fa-eye-slash"></i>'
            : '<i class="fa-solid fa-eye"></i>';

      }
    );


    /* ==========================================
       NORMALISER TELEPHONE
    ========================================== */

    function normalizePhone(value) {

      return String(value || "")
        .trim()
        .replace(/\D/g, "");

    }


    /* ==========================================
       ERREUR PROPRE
    ========================================== */

    function getErrorMessage(error) {

      const raw =
        String(
          error?.message || ""
        );


      if (
        raw.toLowerCase().includes(
          "identifiants"
        )
      ) {

        return "Identifiants administrateur incorrects.";

      }


      if (
        raw.toLowerCase().includes(
          "non autorisé"
        )
      ) {

        return "Ce compte ne possède pas les droits administrateur.";

      }


      if (
        raw.toLowerCase().includes(
          "inactif"
        )
      ) {

        return "Ce compte administrateur est inactif.";

      }


      return (
        raw ||
        "Une erreur est survenue. Veuillez réessayer."
      );

    }


    /* ==========================================
       CONNEXION ADMINISTRATEUR
    ========================================== */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        hideMessage();


        const selectedCountry =
          country.value.trim().toUpperCase();


        const normalizedPhone =
          normalizePhone(phone.value);


        const enteredPassword =
          password.value;


        if (!selectedCountry) {

          showMessage(
            "Veuillez sélectionner votre pays."
          );

          country.focus();

          return;
        }


        if (!normalizedPhone) {

          showMessage(
            "Veuillez saisir votre numéro de téléphone."
          );

          phone.focus();

          return;
        }


        if (!enteredPassword) {

          showMessage(
            "Veuillez saisir votre mot de passe."
          );

          password.focus();

          return;
        }


        loginButton.disabled =
          true;


        loginButton.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';


        try {

          const {
            data,
            error
          } = await supabaseClient.rpc(
            "login_admin",
            {
              p_country_code:
                selectedCountry,

              p_phone:
                normalizedPhone,

              p_password:
                enteredPassword
            }
          );


          if (error) {
            throw error;
          }


          if (
            !data ||
            !data.token
          ) {

            throw new Error(
              "Connexion administrateur impossible."
            );

          }


          /*
            SESSION ADMIN

            Le token est celui généré
            côté PostgreSQL.
          */

          localStorage.setItem(
            "rolex_admin_session_token",
            data.token
          );


          if (data.admin_id) {

            localStorage.setItem(
              "rolex_admin_id",
              data.admin_id
            );

          }


          if (data.role) {

            localStorage.setItem(
              "rolex_admin_role",
              data.role
            );

          }


          if (data.user_code) {

            localStorage.setItem(
              "rolex_admin_user_code",
              data.user_code
            );

          }


          if (data.full_name) {

            localStorage.setItem(
              "rolex_admin_name",
              data.full_name
            );

          }


          showMessage(
            "Connexion réussie. Ouverture de l'administration...",
            "success"
          );


          /*
            Redirection vers le futur
            dashboard administrateur.
          */

          setTimeout(
            () => {

              window.location.href =
                "dashboard-admin.html";

            },
            700
          );


        } catch (error) {

          console.error(
            "Erreur connexion administrateur :",
            error
          );


          showMessage(
            getErrorMessage(error),
            "error"
          );


          loginButton.disabled =
            false;


          loginButton.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

        }

      }
    );

  </script>

</body>
  </html>
