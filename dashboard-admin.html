<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROLEX — Administration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --bg: #020b07;
      --bg-2: #04130c;
      --panel: #071b11;
      --panel-2: #092217;
      --border: rgba(212, 163, 23, .18);
      --gold: #d4a317;
      --gold-light: #f1ca4b;
      --green: #10b981;
      --green-dark: #087f5b;
      --white: #f7faf8;
      --muted: #8fa39a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --sidebar: 270px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(16,185,129,.08), transparent 30%),
        radial-gradient(circle at bottom left, rgba(212,163,23,.05), transparent 25%),
        var(--bg);
      color: var(--white);
      min-height: 100vh;
    }

    button,
    a {
      font-family: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .mobile-header {
      display: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sidebar);
      background: linear-gradient(180deg, #03150c 0%, #020b07 100%);
      border-right: 1px solid var(--border);
      z-index: 1000;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 28px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), #8b6806);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #061008;
      font-weight: 900;
      font-size: 18px;
    }

    .brand-text strong {
      display: block;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .brand-text span {
      color: var(--gold-light);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .menu-title {
      color: #60776c;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 0 12px 10px;
      font-weight: 700;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 13px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: .2s ease;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--white);
      background: rgba(16,185,129,.10);
    }

    .nav-item.active {
      border-left: 3px solid var(--gold);
      padding-left: 10px;
    }

    .sidebar-bottom {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .logout-btn {
      color: #e7a0a0;
    }

    .main {
      margin-left: var(--sidebar);
      min-height: 100vh;
      padding: 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .page-title p {
      color: var(--muted);
      margin-top: 7px;
      font-size: 13px;
    }

    .admin-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(7,27,17,.85);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 12px;
    }

    .admin-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--green), #075c43);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .admin-profile strong {
      display: block;
      font-size: 12px;
    }

    .admin-profile span {
      display: block;
      color: var(--gold-light);
      font-size: 10px;
      margin-top: 3px;
    }

    .security-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, rgba(16,185,129,.10), rgba(212,163,23,.05));
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 13px;
      margin-bottom: 22px;
    }

    .security-banner i {
      color: var(--green);
      font-size: 18px;
    }

    .security-banner div {
      font-size: 12px;
      color: var(--muted);
    }

    .security-banner strong {
      color: var(--white);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: linear-gradient(145deg, rgba(9,34,23,.96), rgba(4,18,12,.96));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      min-height: 125px;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: rgba(212,163,23,.10);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      margin-top: 16px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .stat-value.money {
      font-size: 20px;
    }

    .modules {
      margin-top: 10px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .module {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 13px;
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .module-icon {
      width: 43px;
      height: 43px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16,185,129,.10);
      color: var(--green);
      flex-shrink: 0;
    }

    .module strong {
      display: block;
      font-size: 13px;
    }

    .module span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    .empty-module {
      opacity: .5;
    }

    .loading {
      color: var(--muted);
      padding: 25px 0;
      font-size: 13px;
    }

    .error-box {
      display: none;
      padding: 14px;
      border: 1px solid rgba(239,68,68,.25);
      background: rgba(239,68,68,.07);
      color: #fca5a5;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .server-time {
      margin-top: 25px;
      color: #60776c;
      font-size: 10px;
    }

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .module-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .mobile-header {
        position: sticky;
        top: 0;
        z-index: 1100;
        height: 62px;
        background: #03150c;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
      }

      .mobile-brand {
        font-weight: 800;
        letter-spacing: 1px;
      }

      .menu-toggle {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: transparent;
        color: var(--white);
        cursor: pointer;
      }

      .sidebar {
        transform: translateX(-100%);
        transition: transform .25s ease;
        top: 62px;
        width: 265px;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding: 20px 14px 30px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-title h1 {
        font-size: 23px;
      }

      .admin-profile {
        width: 100%;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
        min-height: 115px;
      }

      .stat-value {
        font-size: 19px;
      }

      .stat-value.money {
        font-size: 16px;
      }

      .module-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="mobile-header">
    <div class="mobile-brand">ROLEX ADMIN</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">R</div>
      <div class="brand-text">
        <strong>ROLEX</strong>
        <span>Administration</span>
      </div>
    </div>

    <div class="menu-title">Administration</div>

    <nav class="nav">

      <button class="nav-item active">
        <i class="fa-solid fa-chart-line"></i>
        <span>Tableau de bord</span>
      </button>

      <button class="nav-item" data-permission="deposits.view">
        <i class="fa-solid fa-money-bill-transfer"></i>
        <span>Dépôts</span>
      </button>

      <button class="nav-item" data-permission="investments.view">
        <i class="fa-solid fa-chart-column"></i>
        <span>Investissements</span>
      </button>

      <button class="nav-item" data-permission="withdrawals.view">
        <i class="fa-solid fa-wallet"></i>
        <span>Retraits</span>
      </button>

      <button class="nav-item" data-permission="payments.view">
        <i class="fa-solid fa-credit-card"></i>
        <span>Paiements</span>
      </button>

      <button class="nav-item super-only">
        <i class="fa-solid fa-users"></i>
        <span>Utilisateurs</span>
      </button>

      <button class="nav-item super-only">
        <i class="fa-solid fa-box-open"></i>
        <span>Produits</span>
      </button>

      <button class="nav-item super-only">
        <i class="fa-solid fa-user-shield"></i>
        <span>Administrateurs</span>
      </button>

      <button class="nav-item super-only">
        <i class="fa-solid fa-sliders"></i>
        <span>Paramètres</span>
      </button>

    </nav>

    <div class="sidebar-bottom">
      <button class="nav-item logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Déconnexion</span>
      </button>
    </div>

  </aside>

  <main class="main">

    <div class="topbar">
      <div class="page-title">
        <h1>Tableau de bord</h1>
        <p>Vue administrative de la plateforme ROLEX</p>
      </div>

      <div class="admin-profile">
        <div class="admin-avatar" id="adminAvatar">A</div>
        <div>
          <strong id="adminName">Chargement...</strong>
          <span id="adminPosition">...</span>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="security-banner">
      <i class="fa-solid fa-shield-halved"></i>
      <div>
        <strong id="roleLabel">Vérification des droits...</strong>
        <br>
        Les informations affichées sont chargées directement depuis la base de données.
      </div>
    </div>

    <div class="section-title">Vue d'ensemble</div>

    <div class="stats-grid" id="statsGrid">
      <div class="loading">Chargement des données...</div>
    </div>

    <section class="modules">
      <div class="section-title">Modules accessibles</div>

      <div class="module-grid" id="moduleGrid"></div>
    </section>

    <div class="server-time" id="serverTime"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard-admin.js"></script>

</body>
  </html>
