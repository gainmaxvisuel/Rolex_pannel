<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROLEX Admin — Retraits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg:#03140a;
      --panel:#071b10;
      --panel2:#092416;
      --border:rgba(212,163,23,.18);
      --gold:#d4a317;
      --gold-light:#f0c94d;
      --green:#10b981;
      --white:#f5f7f6;
      --muted:#91a39a;
      --danger:#ef4444;
      --blue:#3b82f6;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:"Inter",sans-serif;
      background:
        radial-gradient(circle at top right,rgba(16,185,129,.08),transparent 30%),
        radial-gradient(circle at bottom left,rgba(212,163,23,.06),transparent 30%),
        var(--bg);
      color:var(--white);
      min-height:100vh;
    }

    button,input,select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .header {
      position:sticky;
      top:0;
      z-index:20;
      height:72px;
      padding:0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(3,20,10,.96);
      backdrop-filter:blur(15px);
      border-bottom:1px solid var(--border);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-icon {
      width:42px;
      height:42px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,var(--gold),#8f6d09);
      color:#10150d;
    }

    .brand-text strong {
      display:block;
      font-size:17px;
    }

    .brand-text span {
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:11px;
    }

    .back-btn {
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
      color:var(--white);
      padding:10px 14px;
      border-radius:10px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .container {
      width:min(1100px,calc(100% - 24px));
      margin:25px auto;
    }

    .page-title {
      margin-bottom:18px;
    }

    .page-title h1 {
      font-size:30px;
      font-weight:800;
    }

    .page-title p {
      color:var(--muted);
      margin-top:7px;
      font-size:13px;
    }

    .toolbar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      padding:14px;
      margin-bottom:18px;
      background:linear-gradient(145deg,rgba(9,36,22,.92),rgba(5,30,16,.92));
      border:1px solid var(--border);
      border-radius:14px;
    }

    .toolbar select,
    .toolbar input {
      height:42px;
      border:1px solid rgba(255,255,255,.09);
      border-radius:10px;
      background:rgba(0,0,0,.22);
      color:var(--white);
      outline:none;
      padding:0 12px;
    }

    .toolbar input {
      flex:1;
      min-width:220px;
    }

    .refresh-btn {
      height:42px;
      border:1px solid rgba(16,185,129,.25);
      background:rgba(16,185,129,.08);
      color:#7ee8c3;
      padding:0 15px;
      border-radius:10px;
    }

    .withdrawals {
      display:grid;
      gap:14px;
    }

    .withdrawal-card {
      background:linear-gradient(145deg,rgba(7,27,16,.98),rgba(5,24,13,.98));
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
    }

    .card-top {
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .user-name {
      font-size:15px;
      font-weight:700;
    }

    .user-code {
      color:var(--muted);
      font-size:10px;
      margin-top:5px;
    }

    .status {
      padding:6px 9px;
      border-radius:8px;
      font-size:10px;
      font-weight:700;
      white-space:nowrap;
    }

    .status.pending {
      color:#fcd34d;
      background:rgba(245,158,11,.1);
      border:1px solid rgba(245,158,11,.18);
    }

    .status.verified {
      color:#93c5fd;
      background:rgba(59,130,246,.1);
      border:1px solid rgba(59,130,246,.18);
    }

    .status.approved {
      color:#6ee7b7;
      background:rgba(16,185,129,.1);
      border:1px solid rgba(16,185,129,.18);
    }

    .status.rejected {
      color:#fca5a5;
      background:rgba(239,68,68,.1);
      border:1px solid rgba(239,68,68,.18);
    }

    .account-box {
      margin:14px;
      padding:15px;
      border-radius:13px;
      border:1px solid rgba(212,163,23,.25);
      background:rgba(212,163,23,.055);
    }

    .account-title {
      color:var(--gold-light);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.6px;
      margin-bottom:12px;
    }

    .account-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .account-item {
      background:rgba(0,0,0,.18);
      border-radius:9px;
      padding:10px;
    }

    .account-item span {
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-bottom:5px;
    }

    .account-item strong {
      display:block;
      font-size:13px;
      word-break:break-word;
    }

    .amount-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      padding:0 14px 14px;
    }

    .amount-box {
      padding:12px;
      border-radius:10px;
      background:rgba(255,255,255,.035);
    }

    .amount-box span {
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-bottom:5px;
    }

    .amount-box strong {
      font-size:15px;
    }

    .requested {
      color:var(--gold-light);
    }

    .net {
      color:#6ee7b7;
    }

    .fee {
      color:#fca5a5;
    }

    .meta {
      padding:0 14px 14px;
      color:var(--muted);
      font-size:11px;
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .actions {
      padding:14px;
      border-top:1px solid rgba(255,255,255,.05);
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .action-btn {
      border:1px solid rgba(255,255,255,.09);
      border-radius:9px;
      background:rgba(255,255,255,.035);
      color:#dbe4df;
      padding:9px 12px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      font-size:11px;
    }

    .action-btn.verify {
      color:#93c5fd;
      border-color:rgba(59,130,246,.22);
    }

    .action-btn.approve {
      color:#6ee7b7;
      border-color:rgba(16,185,129,.22);
    }

    .action-btn.reject {
      color:#fca5a5;
      border-color:rgba(239,68,68,.22);
    }

    .loading,
    .empty {
      padding:60px 20px;
      text-align:center;
      color:var(--muted);
    }

    .loading i {
      color:var(--gold);
      font-size:22px;
      margin-bottom:12px;
    }

    .modal {
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(5px);
    }

    .modal.show {
      display:flex;
    }

    .modal-card {
      width:min(460px,100%);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:20px;
    }

    .modal-header {
      display:flex;
      justify-content:space-between;
      margin-bottom:15px;
    }

    .close-btn {
      width:34px;
      height:34px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:9px;
      background:rgba(255,255,255,.03);
      color:var(--muted);
    }

    textarea {
      width:100%;
      min-height:110px;
      resize:vertical;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(0,0,0,.22);
      color:var(--white);
      outline:none;
    }

    .modal-actions {
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:14px;
    }

    .modal-btn {
      padding:10px 14px;
      border-radius:9px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.04);
      color:var(--white);
    }

    .modal-btn.danger {
      color:#fca5a5;
      border-color:rgba(239,68,68,.25);
      background:rgba(239,68,68,.1);
    }

    #toast {
      position:fixed;
      right:18px;
      top:18px;
      z-index:9999;
      display:none;
      max-width:380px;
      padding:13px 16px;
      border-radius:10px;
      color:white;
      font-size:13px;
      font-weight:600;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    @media(max-width:650px) {
      .header {
        padding:0 12px;
      }

      .brand-text span,
      .back-btn span {
        display:none;
      }

      .back-btn {
        width:40px;
        height:40px;
        padding:0;
        justify-content:center;
      }

      .container {
        width:calc(100% - 16px);
        margin-top:18px;
      }

      .page-title h1 {
        font-size:25px;
      }

      .toolbar {
        flex-direction:column;
      }

      .toolbar input,
      .toolbar select,
      .refresh-btn {
        width:100%;
      }

      .account-grid,
      .amount-grid {
        grid-template-columns:1fr;
      }

      .card-top {
        align-items:flex-start;
      }

      .actions {
        display:grid;
        grid-template-columns:1fr;
      }

      .action-btn {
        justify-content:center;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="brand-icon">
      <i class="fa-solid fa-money-bill-transfer"></i>
    </div>

    <div class="brand-text">
      <strong>ROLEX ADMIN</strong>
      <span>Gestion des retraits</span>
    </div>
  </div>

  <button class="back-btn" id="backBtn">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Tableau de bord</span>
  </button>
</header>

<main class="container">

  <div class="page-title">
    <h1>Retraits</h1>
    <p>
      Les informations du compte de réception sont affichées automatiquement.
    </p>
  </div>

  <div class="toolbar">

    <select id="statusFilter">
      <option value="">Tous les statuts</option>
      <option value="pending">En attente</option>
      <option value="verified">Vérifiés</option>
      <option value="approved">Approuvés</option>
      <option value="rejected">Rejetés</option>
    </select>

    <input
      type="search"
      id="searchInput"
      placeholder="Rechercher un nom, numéro ou opérateur..."
      autocomplete="off"
    >

    <button class="refresh-btn" id="refreshBtn">
      <i class="fa-solid fa-rotate"></i>
      Actualiser
    </button>

  </div>

  <div id="withdrawals" class="withdrawals"></div>

  <div id="loading" class="loading">
    <i class="fa-solid fa-circle-notch fa-spin"></i>
    <div>Chargement des retraits...</div>
  </div>

  <div id="empty" class="empty" style="display:none;">
    Aucun retrait trouvé.
  </div>

</main>

<div class="modal" id="rejectModal">

  <div class="modal-card">

    <div class="modal-header">
      <h3>Rejeter le retrait</h3>

      <button class="close-btn" id="closeReject">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <textarea
      id="rejectReason"
      placeholder="Motif du rejet..."
    ></textarea>

    <div class="modal-actions">

      <button class="modal-btn" id="cancelReject">
        Annuler
      </button>

      <button class="modal-btn danger" id="confirmReject">
        <i class="fa-solid fa-ban"></i>
        Confirmer
      </button>

    </div>

  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-retraits.js"></script>

</body>
</html>
